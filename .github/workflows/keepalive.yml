name: Keepalive (ping Supabase)

# Pings the app's /api/keepalive endpoint so the Supabase free-tier project
# doesn't auto-pause after ~7 days of inactivity. This is a more reliable
# backup to the Vercel Cron in vercel.json (Hobby crons are best-effort).
#
# Runs from the repository's default branch. If the app requires a secret,
# add a repository secret named CRON_SECRET matching the one set in Vercel.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          URL="${KEEPALIVE_URL:-https://app.dogsanook.com/api/keepalive}"
          echo "Pinging $URL"
          code=$(curl -sS -L -o /tmp/body.txt -w '%{http_code}' \
            --retry 4 --retry-delay 5 --max-time 60 \
            ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
            "$URL")
          echo "HTTP $code"
          cat /tmp/body.txt
          echo
          test "$code" = "200"
